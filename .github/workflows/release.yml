name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake gfortran ninja-build

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --locked --all-targets

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --locked --no-deps --all-features

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  build-portable:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            binary_architecture: arm64
            macos_minimum: "11.0"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            binary_architecture: x86_64
            macos_minimum: "11.0"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: musl
            binary_architecture: x86_64
            macos_minimum: ""
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_minimum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install release dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils gfortran musl-tools python3

      - name: Install release dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Install Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "${{ matrix.target }}"

      - name: Resolve release version
        shell: bash
        run: |
          manifest_version="$(cargo +1.97.1 metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "fortran-fcache"))')"
          version="$manifest_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$manifest_version" ]]; then
              echo "Tag version $version does not match Cargo.toml version $manifest_version" >&2
              exit 1
            fi
          fi
          echo "FCACHE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "FCACHE_PACKAGE=fcache-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo +1.97.1 build --locked --release --target "${{ matrix.target }}"

      - name: Package archive
        run: scripts/package_release.sh "$FCACHE_RELEASE_VERSION" "${{ matrix.target }}"

      - name: Smoke-test packaged binary
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/fcache-release-smoke"
          mkdir -p "$smoke_dir"
          tar -C "$smoke_dir" -xzf "dist/$FCACHE_PACKAGE.tar.gz"
          scripts/smoke_release_binary.sh "$smoke_dir/$FCACHE_PACKAGE/fcache"

      - name: Audit macOS binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          binary="dist/$FCACHE_PACKAGE/fcache"
          file "$binary"
          actual_architecture="$(lipo -archs "$binary")"
          test "$actual_architecture" = "${{ matrix.binary_architecture }}"
          minimum="$(otool -l "$binary" | awk '/minos/ { print $2; exit }')"
          if [[ "$minimum" != "${{ matrix.macos_minimum }}" ]]; then
            echo "Expected macOS minimum ${{ matrix.macos_minimum }}, found $minimum" >&2
            exit 1
          fi

      - name: Audit static musl binary
        if: matrix.platform == 'musl'
        shell: bash
        run: |
          binary="dist/$FCACHE_PACKAGE/fcache"
          file "$binary"
          if readelf --program-headers "$binary" | grep INTERP >/dev/null; then
            echo "musl release binary unexpectedly contains a program interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" | grep NEEDED >/dev/null; then
            echo "musl release binary unexpectedly depends on a shared library" >&2
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-gnu:
    name: Build x86_64-unknown-linux-gnu
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
    steps:
      - name: Install build and audit dependencies
        run: dnf install -y binutils ca-certificates diffutils file gcc gcc-toolset-11-gcc-gfortran git gzip python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: x86_64-unknown-linux-gnu

      - name: Resolve release version
        shell: bash
        run: |
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "fortran-fcache"))')"
          version="$manifest_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$manifest_version" ]]; then
              echo "Tag version $version does not match Cargo.toml version $manifest_version" >&2
              exit 1
            fi
          fi
          echo "FCACHE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "FCACHE_PACKAGE=fcache-$version-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package archive
        run: scripts/package_release.sh "$FCACHE_RELEASE_VERSION" x86_64-unknown-linux-gnu

      - name: Smoke-test packaged binary on glibc 2.28
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/fcache-release-smoke"
          mkdir -p "$smoke_dir"
          tar -C "$smoke_dir" -xzf "dist/$FCACHE_PACKAGE.tar.gz"
          scripts/smoke_release_binary.sh \
            "$smoke_dir/$FCACHE_PACKAGE/fcache" \
            /opt/rh/gcc-toolset-11/root/usr/bin/gfortran

      - name: Audit glibc compatibility
        shell: bash
        run: |
          binary="dist/$FCACHE_PACKAGE/fcache"
          file "$binary"
          if ! readelf --program-headers "$binary" | grep 'Requesting program interpreter' >/dev/null; then
            echo "GNU Linux release binary is not dynamically linked" >&2
            exit 1
          fi
          objdump --dynamic-syms "$binary" | python3 -c '
          import re
          import sys

          versions = {
              tuple(map(int, match))
              for match in re.findall(r"GLIBC_(\d+)\.(\d+)", sys.stdin.read())
          }
          if not versions:
              raise SystemExit("GNU Linux release binary has no GLIBC symbol requirements")
          maximum = max(versions)
          print(f"maximum required glibc symbol version: {maximum[0]}.{maximum[1]}")
          if maximum > (2, 28):
              raise SystemExit("GNU Linux release binary requires glibc newer than 2.28")
          '

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-portable, build-gnu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create combined checksum manifest
        run: |
          cd dist
          sha256sum ./*.tar.gz | sort -k 2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "fcache ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
