name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake gfortran ninja-build

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --locked --all-targets

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --locked --no-deps --all-features

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fortran-fcache") | .version')"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version $version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi
          echo "FCACHE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Install Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "${{ matrix.target }}"

      - name: Build release binary
        run: cargo +1.97.1 build --locked --release --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          package="fcache-${FCACHE_RELEASE_VERSION}-${{ matrix.target }}"
          install -d "dist/$package"
          install -m 755 "target/${{ matrix.target }}/release/fcache" "dist/$package/fcache"
          install -d "dist/$package/scripts"
          install -m 755 scripts/benchmark_acceptance.py "dist/$package/scripts/benchmark_acceptance.py"
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/$package/"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create combined checksum manifest
        run: |
          cd dist
          sha256sum ./*.tar.gz | sort -k 2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "fcache ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
