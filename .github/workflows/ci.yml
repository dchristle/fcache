name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake gfortran ninja-build
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake gcc ninja
      - name: Verify required build tools
        run: |
          command -v gfortran
          gfortran --version
          command -v cmake
          cmake --version
          command -v ninja
          ninja --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Test performance harness
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: python3 -m unittest scripts/test_benchmark_acceptance.py
      - run: cargo build --locked --release
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  arch-smoke:
    name: Arch Linux / Rust stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install toolchain and compiler
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake gcc-fortran git ninja rust
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify required build tools
        run: |
          command -v gfortran
          gfortran --version
          command -v cmake
          cmake --version
          command -v ninja
          ninja --version
      - run: cargo test --locked --all-targets

  gfortran-matrix:
    name: GNU Fortran ${{ matrix.gfortran }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: gcc:${{ matrix.gfortran }}
    strategy:
      fail-fast: false
      matrix:
        gfortran: ['11', '12', '13', '14', '15', '16']
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates cmake curl ninja-build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
      - name: Verify compiler major
        shell: bash
        run: |
          actual="$(gfortran -dumpversion | cut -d. -f1)"
          test "$actual" = "${{ matrix.gfortran }}"
      - run: cargo test --locked --all-targets

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
